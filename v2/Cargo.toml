[package]
name = "github_downloader"
version = "2.1.0"
edition = "2024"
description = "GitHub 加速下载器 v2.0（Rust 重构）"
license = "MIT"

[[bin]]
name = "GitHubDownloader"
path = "src/main.rs"

[dependencies]
# 只用 glow 渲染后端（砍掉默认拉入的 wgpu，省 ~5MB 体积）
eframe = { version = "0.36", default-features = false, features = ["glow", "default_fonts"] }
image = { version = "0.25", default-features = false, features = ["ico"] }
# 下载器刻意不启用 gzip/brotli 等解压特性：必须拿到与 Content-Length 一致的原始字节，
# 否则 Range/断点续传的偏移语义会被破坏。TLS 用系统 schannel（Windows 独占目标）。
reqwest = { version = "0.12", default-features = false, features = ["blocking", "default-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
winreg = "0.52"
rfd = "0.15"
arboard = "3"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
thiserror = "2"

[build-dependencies]
winresource = "0.1"

[profile.release]
lto = "thin"
strip = true
codegen-units = 1
